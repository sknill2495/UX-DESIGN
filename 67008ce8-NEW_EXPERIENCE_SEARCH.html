<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSearch — Intelligent Supply Search</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────── */
:root {
  --bg:         #f4f5f7;
  --surface:    #ffffff;
  --surface-2:  #f0f2f5;
  --border:     #dde1e7;
  --border-h:   #b3bfc9;
  --primary:    #0052cc;
  --primary-dk: #0043a8;
  --primary-dim:#e8f0fc;
  --success:    #006644; --success-bg:#e3fcef;
  --warning:    #7a4100; --warning-bg:#fff4e6;
  --danger:     #bf2600; --danger-bg: #ffebe6;
  --purple:     #403294; --purple-bg: #eae6ff;
  --t1: #172b4d; --t2: #42526e; --t3: #8993a4; --t4: #c1c7d0;
  /* aliases */
  --teal:var(--primary); --teal-dim:var(--primary-dim);
  --blue:var(--primary); --blue-dim:var(--primary-dim);
  --amber:var(--warning); --amber-dim:var(--warning-bg);
  --red:var(--danger);   --red-dim:var(--danger-bg);
  --purple-dim:var(--purple-bg);
  --text-primary:var(--t1); --text-secondary:var(--t2); --text-muted:var(--t3);
  --r:8px; --r-lg:12px;
  /* shadows */
  --sh-xs:0 1px 2px rgba(23,43,77,.05);
  --sh-sm:0 2px 6px rgba(23,43,77,.09);
  --sh-md:0 4px 14px rgba(23,43,77,.12);
  --sh-focus:0 0 0 3px rgba(0,82,204,.18);
  /* layout */
  --header-h:64px; --sidebar:240px; --max-w:1120px;
  --mono:'IBM Plex Mono',monospace; --sans:'Sora',sans-serif;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);font-size:13px;background:var(--bg);color:var(--t1);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ── HEADER ────────────────────────────────────────────────── */
.hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--border);
  box-shadow:var(--sh-xs);
  backdrop-filter:blur(12px);
  padding:0 24px;
  display:grid;
  grid-template-columns:160px 1fr 120px;
  align-items:start;
  gap:24px;
}
.logo{height:var(--header-h);display:flex;align-items:center;font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--t1);user-select:none;}
.logo span{color:var(--primary);}
.hdr-search-wrap{display:flex;flex-direction:column;padding:10px 0;}
.hdr-right{height:var(--header-h);display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.hdr-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;}
.hdr-icon:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}

/* ── SEARCH BOX ─────────────────────────────────────────────── */
.s-wrap{position:relative;}
.s-box{
  display:flex;align-items:center;
  height:44px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:0 8px 0 14px;
  gap:10px;
  box-shadow:var(--sh-xs);
  transition:border-color .18s,box-shadow .18s;
}
.s-box:focus-within{border-color:var(--primary);box-shadow:var(--sh-focus);}
.s-ico{color:var(--t3);flex-shrink:0;display:flex;}
#qi{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--t1);caret-color:var(--primary);}
#qi::placeholder{color:var(--t3);}
.s-btn{
  height:32px;padding:0 16px;
  background:var(--primary);color:#fff;
  border:none;border-radius:8px;
  font-family:var(--sans);font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:background .15s;flex-shrink:0;
}
.s-btn:hover{background:var(--primary-dk);}
.s-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* Intent row — in-flow inside header, collapses to 0 when no intent detected */
.intent-row{
  display:flex;align-items:center;gap:8px;
  max-height:0;
  overflow:hidden;
  opacity:0;
  padding:0 10px;
  margin-top:0;
  pointer-events:none;
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:8px;
  transition:max-height .22s ease, opacity .18s ease, padding .22s ease, margin-top .22s ease, border-color .22s;
}
.intent-row.has-intent{
  max-height:40px;
  opacity:1;
  padding:6px 10px;
  margin-top:6px;
  pointer-events:auto;
  border-color:var(--border);
}
.intent-lbl{font-size:10px;font-family:var(--mono);color:var(--t3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;
  font-size:10px;font-weight:600;font-family:var(--mono);
  letter-spacing:.04em;text-transform:uppercase;
}
.badge.product{background:var(--primary-dim);color:var(--primary);}
.badge.document{background:var(--primary-dim);color:var(--primary);}
.badge.qa{background:var(--purple-bg);color:var(--purple);}
.badge.ambiguous{background:var(--warning-bg);color:var(--warning);}
.conf-bar{width:80px;height:3px;background:var(--surface-2);border-radius:999px;overflow:hidden;}
.conf-fill{height:100%;border-radius:999px;transition:width .3s,background .3s;}
.conf-pct{font-size:10px;font-family:var(--mono);color:var(--t3);}

/* ── AUTOCOMPLETE ───────────────────────────────────────────── */
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-md);overflow:hidden;z-index:300;display:none;}
.ac-drop.open{display:block;}
.ac-item{padding:9px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:12px;color:var(--t2);transition:background .1s;}
.ac-item:hover{background:var(--surface-2);color:var(--t1);}
.ac-ico{width:20px;font-size:14px;flex-shrink:0;text-align:center;}

/* ── DISAMBIGUATION ─────────────────────────────────────────── */
.disambig{display:none;background:var(--surface);border:1.5px solid var(--warning);border-radius:10px;padding:14px 16px;box-shadow:var(--sh-sm);margin-top:6px;}
.disambig.open{display:block;}
.disambig-title{font-size:10px;font-family:var(--mono);color:var(--warning);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.disambig-opts{display:flex;flex-wrap:wrap;gap:8px;}
.disambig-btn{padding:7px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--t1);cursor:pointer;font-family:var(--sans);transition:all .15s;}
.disambig-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}

/* ── HERO STRIP (chips only) ────────────────────────────────── */
.hero{max-width:var(--max-w);margin:0 auto;padding:12px 24px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  height:30px;padding:0 12px;
  border:1px solid var(--border);border-radius:999px;
  font-size:12px;color:var(--t2);
  cursor:pointer;background:var(--surface);font-family:var(--sans);
  display:inline-flex;align-items:center;
  box-shadow:var(--sh-xs);
  transition:all .15s;
}
.chip:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}

/* ── RESULTS AREA ───────────────────────────────────────────── */
.results{max-width:var(--max-w);margin:0 auto;padding:24px 24px 80px;animation:fadeUp .22s ease-out;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── RESULT HEADER ──────────────────────────────────────────── */
.r-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.r-meta{font-size:12px;font-family:var(--mono);color:var(--t3);margin-top:4px;}
.r-tag{flex-shrink:0;padding:5px 12px;border-radius:999px;font-size:10px;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;}

/* ── TABS ───────────────────────────────────────────────────── */
.res-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
.rtab{
  padding:9px 18px;
  font-size:13px;font-weight:500;font-family:var(--sans);
  color:var(--t2);background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.rtab:hover{color:var(--t1);}
.rtab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
.tab-count{font-size:11px;font-family:var(--mono);margin-left:5px;opacity:.6;}

/* ── PRODUCT LAYOUT ─────────────────────────────────────────── */
.prod-layout{display:grid;grid-template-columns:var(--sidebar) 1fr;gap:24px;align-items:start;}
.prod-main{display:flex;flex-direction:column;gap:16px;}
.filter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.filter-row-left{display:flex;align-items:center;gap:12px;}
.result-count-label{font-size:12px;color:var(--t3);font-family:var(--mono);}
.sort-sel{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;font-family:var(--sans);color:var(--t2);cursor:pointer;}
.sort-sel:focus{outline:none;border-color:var(--primary);}
.view-toggle{display:flex;gap:2px;}
.vtbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--t3);cursor:pointer;transition:all .15s;}
.vtbtn:hover,.vtbtn.active{background:var(--surface-2);color:var(--t1);border-color:var(--primary);}

/* ── PRODUCT CARD GRID ──────────────────────────────────────── */
.pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:16px;}
.pcard{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--sh-xs);
  transition:box-shadow .18s,border-color .18s,transform .18s;
}
.pcard:hover{border-color:var(--primary);box-shadow:var(--sh-md);transform:translateY(-2px);}

/* Image zone */
.pcard-imgzone{
  height:148px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border);
  overflow:hidden;
}
.pcard-imgzone svg{width:90px;height:90px;}

/* Card body — 12px padding, 8px between groups */
.pcard-body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1;}
.pcard-brand-lbl{font-size:10px;color:var(--t3);font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;}
.pcard-title{font-size:12px;font-weight:600;color:var(--primary);line-height:1.35;cursor:pointer;}
.pcard-title:hover{text-decoration:underline;}
.pcard-ids{display:flex;flex-direction:column;gap:3px;}
.pcard-id-row{display:flex;align-items:center;gap:4px;font-size:10px;font-family:var(--mono);color:var(--t2);}
.pcard-id-lbl{color:var(--t3);}
.pcard-copy{background:none;border:none;cursor:pointer;color:var(--t3);padding:0;line-height:1;transition:color .12s;}
.pcard-copy:hover{color:var(--primary);}
.pcard-swatches{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.swatch{width:16px;height:16px;border-radius:999px;border:2px solid rgba(0,0,0,.1);cursor:pointer;transition:transform .12s,border-color .12s;}
.swatch:hover,.swatch.sel{transform:scale(1.2);border-color:var(--primary);}
.swatch-more{font-size:10px;font-family:var(--mono);color:var(--t3);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 5px;cursor:pointer;}
.pcard-units{display:flex;gap:4px;}
.unit-btn{flex:1;height:26px;border:1px solid var(--border);border-radius:6px;background:none;font-size:10px;font-family:var(--mono);color:var(--t2);cursor:pointer;transition:all .12s;}
.unit-btn.active{background:var(--primary-dim);border-color:var(--primary);color:var(--primary);font-weight:600;}
.pcard-avail-row{display:flex;align-items:center;gap:5px;font-size:10px;}
.avail-dot-sm{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
.avail-more{color:var(--primary);font-size:10px;}
.avail-more:hover{text-decoration:underline;}
.pcard-price-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}
.pcard-price-block{display:flex;flex-direction:column;}
.pcard-price-lbl{font-size:10px;color:var(--t3);}
.pcard-price-val{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--t1);line-height:1.1;}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.qty-btn{width:28px;height:28px;background:var(--surface-2);border:none;color:var(--t1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.qty-btn:hover{background:var(--border-h);}
.qty-val{width:32px;height:28px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);color:var(--t1);font-size:12px;font-family:var(--mono);text-align:center;font-weight:600;outline:none;}
.pcard-compare{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer;}
.pcard-compare input{accent-color:var(--primary);width:13px;height:13px;cursor:pointer;}

/* ── FILTER SIDEBAR ─────────────────────────────────────────── */
.tab-sidebar{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  position:sticky;
  top:calc(var(--header-h) + 16px);
  box-shadow:var(--sh-xs);
}
.fsec{border-bottom:1px solid var(--border);}
.fsec:last-child{border-bottom:none;}
.fsec-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;font-size:12px;font-weight:600;color:var(--t1);cursor:pointer;user-select:none;transition:background .12s;}
.fsec-hdr:hover{background:var(--surface-2);}
.fsec-icon{font-size:13px;color:var(--t3);}
.fsec.collapsed .fsec-body{display:none;}
.fsec-body{padding:4px 16px 12px;}
.fcheck{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:12px;color:var(--t2);transition:color .12s;}
.fcheck:hover{color:var(--t1);}
.fcheck input{accent-color:var(--primary);width:14px;height:14px;flex-shrink:0;cursor:pointer;}
.fcheck span:first-of-type{flex:1;}
.fcount{font-size:10px;font-family:var(--mono);color:var(--t3);}
.fmore{background:none;border:none;color:var(--primary);font-size:11px;font-family:var(--sans);cursor:pointer;padding:4px 0;display:block;}
.fmore:hover{text-decoration:underline;}

/* ── DOCUMENT TABLE ─────────────────────────────────────────── */
.doclist{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.col-lbl-row{display:grid;grid-template-columns:2fr 110px 130px 90px;gap:16px;padding:9px 20px;background:var(--surface-2);}
.col-lbl{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.08em;}
.ditem{display:grid;grid-template-columns:2fr 110px 130px 90px;gap:16px;padding:14px 20px;background:var(--surface);align-items:center;cursor:pointer;transition:background .12s;}
.ditem:hover{background:var(--surface-2);}
.dtitle{font-size:13px;font-weight:500;color:var(--primary);text-decoration:none;}
.dtitle:hover{text-decoration:underline;}
.dtag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.cc{background:var(--primary-dim);color:var(--primary);}
.cr{background:var(--danger-bg);color:var(--danger);}
.cb{background:var(--warning-bg);color:var(--warning);}
.ca{background:var(--purple-bg);color:var(--purple);}
.cl{background:var(--success-bg);color:var(--success);}
.dup{font-size:12px;font-family:var(--mono);color:var(--t2);}
.dstat{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-family:var(--mono);font-weight:600;}
.s-cur{background:var(--success-bg);color:var(--success);}
.s-rev{background:var(--warning-bg);color:var(--warning);}
.s-exp{background:var(--danger-bg);color:var(--danger);}

/* ── TAB TWO-COLUMN (doc/video/guide tabs) ──────────────────── */
.tab-layout{display:grid;grid-template-columns:var(--sidebar) 1fr;gap:24px;align-items:start;}
.tab-main{display:flex;flex-direction:column;gap:16px;}
.tab-main-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--t2);padding-bottom:12px;border-bottom:1px solid var(--border);}
.tab-main-hdr strong{color:var(--t1);}
.tab-main-hdr em{color:var(--t1);font-style:normal;font-weight:600;}

/* ── DOCUMENT ITEM v2 ───────────────────────────────────────── */
.dlist-v2{display:flex;flex-direction:column;gap:12px;}
.ditem-v2{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;box-shadow:var(--sh-xs);transition:box-shadow .15s,border-color .15s;}
.ditem-v2:hover{border-color:var(--primary);box-shadow:var(--sh-sm);}
.dicon{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dicon-video{background:#1d4ed8;} .dicon-pdf{background:#dc2626;} .dicon-web{background:#7c3aed;}
.ditem-v2-body{flex:1;min-width:0;}
.ditem-v2-title{font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;display:block;margin-bottom:5px;line-height:1.35;}
.ditem-v2-title:hover{text-decoration:underline;}
.ditem-v2-desc{font-size:12px;color:var(--t2);line-height:1.55;margin-bottom:8px;}
.ditem-v2-meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px;}
.dmeta-item{display:flex;align-items:center;gap:4px;font-size:11px;font-family:var(--mono);color:var(--t3);}
.ditem-v2-action{flex-shrink:0;display:flex;align-items:center;}

/* ── CONTENT LIST RESULTS ──────────────────────────────────── */
.content-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.content-summary{font-size:13px;color:var(--t2);}
.content-summary strong,.content-summary em{color:var(--t1);font-style:normal;font-weight:600;}
.content-sort{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.content-sort label{font-size:12px;color:var(--t2);}
.content-list{display:flex;flex-direction:column;gap:12px;}
.content-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  padding:12px;
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:14px;
  align-items:start;
  box-shadow:var(--sh-xs);
  transition:border-color .15s,box-shadow .15s;
}
.content-item:hover{border-color:var(--border-h);box-shadow:var(--sh-sm);}
.content-icon{
  width:44px;height:44px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.content-icon.video{background:#e8f0ff;color:#0052cc;}
.content-icon.pdf{background:#fff0eb;color:#bf2600;}
.content-icon.web{background:#eee9ff;color:#403294;}
.content-body{min-width:0;}
.content-title{font-size:12px;font-weight:700;color:#07406f;line-height:1.35;text-decoration:none;display:block;margin-bottom:4px;}
.content-title:hover{text-decoration:underline;}
.content-desc{font-size:12px;color:var(--t1);line-height:1.45;margin-bottom:10px;max-width:720px;}
.content-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.content-action{display:flex;align-items:center;justify-content:flex-end;padding-top:1px;}
.content-action-btn{
  min-width:84px;height:32px;padding:0 14px;border:1.5px solid #0b4f82;border-radius:999px;
  background:transparent;color:#0b4f82;font-size:12px;font-weight:700;font-family:var(--sans);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.content-action-btn:hover{background:#e8f0fc;border-color:var(--primary);color:var(--primary);}

/* ── Q&A ────────────────────────────────────────────────────── */
.qa-ai-wrap{display:flex;flex-direction:column;gap:24px;}
.qa-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.qa-ai-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:12px;padding:20px;box-shadow:var(--sh-sm);}
.qa-ai-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.qa-ai-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--primary-dim);color:var(--primary);font-size:10px;font-weight:600;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
.qa-feedback{display:flex;align-items:center;gap:6px;}
.qa-fb-btn{height:28px;padding:0 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--sans);color:var(--t2);cursor:pointer;transition:all .12s;}
.qa-fb-btn:hover{border-color:var(--primary);color:var(--primary);}
.qa-query-echo{font-size:11px;font-family:var(--mono);color:var(--t3);margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.qa-answer-body{font-size:14px;line-height:1.75;color:var(--t1);}
.qa-answer-body p{margin-bottom:12px;} .qa-answer-body p:last-child{margin-bottom:0;}
.qa-answer-body strong{font-weight:600;} .qa-answer-body ul,.qa-answer-body ol{padding-left:18px;margin:8px 0;}
.qa-answer-body li{margin-bottom:5px;}
.qa-section{display:flex;flex-direction:column;gap:12px;}
.qa-sec-hdr{display:flex;align-items:center;justify-content:space-between;}
.qa-sec-title{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--t3);display:flex;align-items:center;gap:8px;}
.qa-sec-all{font-size:10px;color:var(--primary);background:none;border:none;cursor:pointer;font-family:var(--mono);}
.qa-sec-all:hover{text-decoration:underline;}
.qa-doc-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:12px;cursor:pointer;box-shadow:var(--sh-xs);transition:all .15s;align-items:flex-start;}
.qa-doc-card:hover{border-color:var(--primary);box-shadow:var(--sh-sm);}
.qa-doc-icon{width:32px;height:32px;border-radius:6px;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qa-doc-info{flex:1;min-width:0;}
.qa-doc-title{font-size:12px;font-weight:500;color:var(--t1);line-height:1.35;margin-bottom:3px;}
.qa-doc-meta{font-size:10px;font-family:var(--mono);color:var(--t3);}
.qa-doc-arrow{color:var(--t3);flex-shrink:0;}
.qa-prod-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:10px;cursor:pointer;align-items:flex-start;box-shadow:var(--sh-xs);transition:all .15s;}
.qa-prod-card:hover{border-color:var(--primary);box-shadow:var(--sh-sm);}
.qa-prod-icon{width:36px;height:36px;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.qa-prod-info{flex:1;min-width:0;}
.qa-prod-name{font-size:12px;font-weight:500;color:var(--t1);line-height:1.35;margin-bottom:3px;}
.qa-prod-sku{font-size:10px;font-family:var(--mono);color:var(--primary);}

/* ── SKELETON ───────────────────────────────────────────────── */
.skel{background:linear-gradient(90deg,#eef0f3 0%,#f5f6f8 50%,#eef0f3 100%);background-size:300% 100%;animation:shimmer 1.5s infinite;border-radius:4px;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel-line{height:12px;margin-bottom:8px;}
.skel-line.w-full{width:100%}.skel-line.w-80{width:80%}.skel-line.w-60{width:60%}

/* ── PAGINATION ─────────────────────────────────────────────── */
.pages{display:flex;gap:4px;justify-content:center;margin-top:24px;}
.pgbtn{width:32px;height:32px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:var(--mono);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs);transition:all .12s;}
.pgbtn:hover{border-color:var(--primary);color:var(--primary);}
.pgbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:none;}

/* ── VIDEO CARDS ────────────────────────────────────────────── */
.qa-video-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.qa-video-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--sh-xs);transition:box-shadow .15s,transform .15s;}
.qa-video-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
.qa-video-thumb{height:110px;display:flex;align-items:center;justify-content:center;position:relative;}
.qa-video-play{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:999px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.4);transition:all .2s;}
.qa-video-card:hover .qa-video-play{background:rgba(255,255,255,.3);transform:scale(1.08);}
.qa-video-duration{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;}
.qa-video-body{padding:10px 12px;}
.qa-video-source{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--t3);margin-bottom:3px;}
.qa-video-title{font-size:12px;font-weight:500;color:var(--t1);line-height:1.35;}

/* ── DOCUMENT CARDS (same grid as video) ────────────────────── */
.doc-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--sh-xs);transition:box-shadow .15s,transform .15s;display:flex;flex-direction:column;}
.doc-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px);}
.doc-card-header{height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;padding:16px;}
.doc-card-icon{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;}
.doc-card-badge{font-size:10px;font-weight:700;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.2);color:#fff;padding:2px 8px;border-radius:999px;}
.doc-card-body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px;}
.doc-card-title{font-size:12px;font-weight:600;color:var(--primary);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.doc-card-title:hover{text-decoration:underline;}
.doc-card-desc{font-size:11px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.doc-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;}
.doc-card-meta-item{display:flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);color:var(--t3);}
.doc-card-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.doc-card-stat{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:999px;font-weight:600;}
.doc-dl-btn{height:28px;padding:0 12px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:background .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.doc-dl-btn:hover{background:var(--primary-dk);}
.doc-view-btn{height:28px;padding:0 12px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:6px;font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.doc-view-btn:hover{background:var(--primary-dim);}

/* ── TEST PANEL ─────────────────────────────────────────────── */
.tpanel{max-width:var(--max-w);margin:32px auto;padding:0 24px 64px;}
.tpanel-hdr{font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:16px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;}
.tpanel-hdr:hover{color:var(--t2);}
#tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.tq{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh-xs);}
.tq:hover{border-color:var(--primary);background:var(--primary-dim);}
.tq-text{font-size:12px;color:var(--t1);font-weight:500;}
.tq-exp{font-size:10px;font-family:var(--mono);color:var(--t3);}
.tq-num{font-size:10px;font-family:var(--mono);color:var(--t4);}

/* ── UTILS ──────────────────────────────────────────────────── */
.hidden{display:none!important;}
.empty-state{text-align:center;padding:64px 32px;color:var(--t2);}

/* ── FEATURE 1: EXACT SKU DISAMBIG ─────────────────────────── */
.exact-dismabig-panel{padding:12px 14px;background:var(--surface);border:1.5px solid #00875a;border-radius:10px;margin-top:6px;}
.exact-disambig-product{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.exact-disambig-img{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.exact-disambig-img svg{width:40px;height:40px;}
.exact-disambig-name{font-size:12px;font-weight:600;color:var(--t1);line-height:1.3;}
.exact-disambig-sku{font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:2px;}
.exact-disambig-price{font-size:13px;font-weight:600;color:var(--t1);margin-top:2px;}
.exact-disambig-actions{display:flex;gap:8px;}
.exact-disambig-btn-primary{flex:1;height:34px;background:#00875a;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.exact-disambig-btn-primary:hover{background:#006644;}
.exact-disambig-btn-secondary{flex:1;height:34px;background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);border-radius:6px;font-size:12px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.exact-disambig-btn-secondary:hover{background:var(--primary-dim);}

/* ── FEATURE 2: ITEM DETAIL PAGE ────────────────────────────── */
.item-page{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);}
.item-page-hero{display:grid;grid-template-columns:300px 1fr;gap:0;}
.item-page-imgzone{background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:32px;border-right:1px solid var(--border);}
.item-page-imgzone svg{width:160px;height:160px;}
.item-page-main{padding:28px 28px 24px;}
.item-page-breadcrumb{font-size:10px;font-family:var(--mono);color:var(--t3);margin-bottom:10px;}
.item-page-name{font-size:18px;font-weight:600;color:var(--t1);line-height:1.3;margin-bottom:8px;}
.item-page-ids{font-size:11px;font-family:var(--mono);color:var(--t3);display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.item-page-ids span{color:var(--t1);}
.item-spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.item-spec-cell{padding:8px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.item-spec-cell:nth-child(even){border-right:none;}
.item-spec-cell:last-child,.item-spec-cell:nth-last-child(2){border-bottom:none;}
.item-spec-label{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.item-spec-val{font-size:12px;font-weight:500;color:var(--t1);}
.item-page-price-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.item-page-price{font-size:24px;font-weight:600;color:var(--t1);}
.item-page-price-unit{font-size:11px;color:var(--t3);font-family:var(--mono);}
.item-page-actions{display:flex;gap:8px;align-items:center;}
.item-add-btn{height:38px;padding:0 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:background .15s;}
.item-add-btn:hover{background:var(--primary-dk);}
.item-compare-btn{height:38px;padding:0 16px;background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);border-radius:8px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:all .15s;}
.item-compare-btn:hover{background:var(--primary-dim);}
.item-page-tabs{border-top:1px solid var(--border);display:flex;gap:0;}
.item-page-tab{padding:10px 20px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.item-page-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.item-page-tab-body{padding:20px 24px;border-top:1px solid var(--border);}

/* ── FEATURE 3: SKU COMPARISON PAGE ─────────────────────────── */
.compare-page{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);}
.compare-page-hdr{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.compare-page-title{font-size:16px;font-weight:600;color:var(--t1);}
.compare-page-sub{font-size:11px;color:var(--t3);font-family:var(--mono);margin-top:2px;}
.compare-grid{display:grid;gap:0;}
.compare-row{display:grid;align-items:stretch;border-bottom:1px solid var(--border);}
.compare-row:last-child{border-bottom:none;}
.compare-row-label{padding:12px 16px;background:var(--surface-2);font-size:11px;font-family:var(--mono);font-weight:500;color:var(--t2);display:flex;align-items:center;border-right:1px solid var(--border);}
.compare-row-val{padding:12px 16px;font-size:12px;color:var(--t1);display:flex;align-items:center;border-right:1px solid var(--border);}
.compare-row-val:last-child{border-right:none;}
.compare-row-val.winner{background:#e3fcef;}
.compare-prod-header{padding:16px 16px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);}
.compare-prod-header:last-child{border-right:none;}
.compare-prod-img{display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.compare-prod-img svg{width:64px;height:64px;}
.compare-prod-name{font-size:12px;font-weight:600;color:var(--primary);line-height:1.3;margin-bottom:4px;}
.compare-prod-sku{font-family:var(--mono);font-size:10px;color:var(--t3);}
.compare-prod-price{font-size:16px;font-weight:600;color:var(--t1);margin-top:6px;}
.compare-badge{display:inline-flex;padding:2px 6px;border-radius:3px;font-size:9px;font-family:var(--mono);font-weight:700;}
.compare-add-btn{width:100%;height:32px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;margin-top:10px;transition:background .15s;}
.compare-add-btn:hover{background:var(--primary-dk);}
.compare-win-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-family:var(--mono);font-weight:700;color:#006644;background:#e3fcef;padding:2px 6px;border-radius:3px;}

/* ── FEATURE 4: FEATURE REDIRECT ─────────────────────────────── */
.feature-redirect{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);}
.feature-redirect-hero{background:linear-gradient(135deg,#0052cc 0%,#003d99 100%);padding:36px 32px;display:flex;align-items:center;gap:24px;}
.feature-redirect-icon{width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.feature-redirect-heading{color:#fff;}
.feature-redirect-label{font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.feature-redirect-title{font-size:22px;font-weight:600;line-height:1.25;margin-bottom:4px;}
.feature-redirect-sub{font-size:13px;color:rgba(255,255,255,.65);}
.feature-redirect-body{padding:24px 28px;}
.feature-redirect-desc{font-size:13px;color:var(--t2);line-height:1.65;margin-bottom:20px;max-width:560px;}
.feature-redirect-cta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;transition:background .15s;text-decoration:none;}
.feature-redirect-cta:hover{background:var(--primary-dk);}
.feature-redirect-links{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.feature-redirect-links-title{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.feature-redirect-link-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.feature-redirect-link{padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;}
.feature-redirect-link:hover{border-color:var(--primary);background:var(--primary-dim);}
.feature-redirect-link-icon{font-size:16px;margin-bottom:4px;}
.feature-redirect-link-name{font-size:12px;font-weight:500;color:var(--t1);}
.feature-redirect-link-desc{font-size:10.5px;color:var(--t3);margin-top:2px;}

/* ── FEATURE 5: ORDER DETAILS PAGE ──────────────────────────── */
.order-page{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm);}
.order-page-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;align-items:start;gap:16px;}
.order-num{font-size:18px;font-weight:600;color:var(--t1);}
.order-meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;}
.order-meta-item{font-size:11px;color:var(--t3);font-family:var(--mono);}
.order-meta-item span{color:var(--t1);font-weight:500;}
.order-status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:600;font-family:var(--mono);}
.order-body{padding:0;}
.order-section-hdr{padding:10px 24px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;}
.order-line-grid{display:grid;grid-template-columns:48px 1fr 80px 80px 90px;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);}
.order-line-grid:last-child{border-bottom:none;}
.order-line-img{width:44px;height:44px;background:var(--surface-2);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.order-line-img svg{width:40px;height:40px;}
.order-line-name{font-size:12px;font-weight:500;color:var(--t1);line-height:1.3;}
.order-line-sku{font-size:10px;font-family:var(--mono);color:var(--t3);margin-top:2px;}
.order-line-val{font-size:12px;color:var(--t2);text-align:center;}
.order-line-total{font-size:12px;font-weight:600;color:var(--t1);text-align:right;}
.order-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);}
.order-footer-total{font-size:15px;font-weight:600;color:var(--t1);}
.order-footer-actions{display:flex;gap:8px;}
.order-action-btn{height:34px;padding:0 16px;border:1.5px solid var(--border);background:var(--surface);color:var(--t1);border-radius:6px;font-size:12px;font-weight:500;font-family:var(--sans);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.order-action-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-dim);}
.order-action-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.order-action-btn.primary:hover{background:var(--primary-dk);}
.order-shipping{padding:16px 24px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.order-ship-block{}
.order-ship-label{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.order-ship-val{font-size:12px;color:var(--t1);line-height:1.6;}

/* ── SEARCH FOCUS DROPDOWN (empty state) ───────────────────── */

function norm(q){ return q.trim().toLowerCase(); }

function kwScore(q, kwArr){
  const n = norm(q); let best=0, hits=0;
  for(const [t,w] of kwArr){ if(n.includes(t)){ if(w>best)best=w; hits++; } }
  if(hits>1) best = Math.min(1.0, best + (hits-1)*0.05);
  return best;
}

function detectIntent(raw){
  // ── Special intents checked first ──────────────────────────
  const special = typeof detectSpecialIntent === 'function' ? detectSpecialIntent(raw) : null;
  if (special) return special;

  const q = raw.trim();
  if(!q) return {intent:null,conf:0,sub:null,ambig:false,all:{},docSubs:{}};

  // Product
  let pScore=0;
  for(const p of RULES.PRODUCT.patterns){ if(p.re.test(q)) pScore=Math.max(pScore,p.w); }
  pScore = Math.max(pScore, kwScore(q, RULES.PRODUCT.kw));
  pScore = Math.max(pScore, productCatalogScore(q));

  // Document — score each subcategory
  let dSubs={}, bestSub=null, maxD=0;
  for(const [name,cfg] of Object.entries(RULES.DOCUMENT.subs)){
    let s = kwScore(q, cfg.kw);
    if(cfg.re) for(const r of cfg.re){ if(r.test(q)) s=Math.max(s,0.96); }
    dSubs[name]=s;
    if(s>maxD){ maxD=s; bestSub=name; }
  }

  // QA
  let qaScore=0;
  for(const p of RULES.QA.patterns){ if(p.re.test(q)) qaScore=Math.max(qaScore,p.w); }
  qaScore=Math.max(qaScore, kwScore(q, RULES.QA.kw));
  if(/^(why|how|what|when|who|where|can|does|is|are|should|which|explain|tell me)\b/i.test(q)) qaScore=Math.max(qaScore,0.98);
  if(maxD<0.3 && pScore<0.3 && q.length>5) qaScore=Math.max(qaScore,0.42);

  const all={PRODUCT:pScore,DOCUMENT:maxD,QA:qaScore};
  const sorted=Object.entries(all).sort((a,b)=>b[1]-a[1]);
  const [topIntent,topScore]=[sorted[0][0],sorted[0][1]];
  const secondScore=sorted[1]?sorted[1][1]:0;
  const ambig=(topScore<0.7)||(topScore-secondScore<0.15&&topScore>0.3&&secondScore>0.3);

  return {
    intent:topIntent,
    conf:parseFloat(topScore.toFixed(2)),
    sub:topIntent==='DOCUMENT'?bestSub:null,
    ambig,
    all,
    dSubs
  };
}

  // New intent types

  SKU_COMPARE: {cls:'product',  fill:'#0052cc', lbl:'Comparing Products'},

function ea(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function hl(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text;
  return text.slice(0,i)+'<strong style="color:var(--teal)">'+text.slice(i,i+q.length)+'</strong>'+text.slice(i+q.length);
}

function updateBadge(r){
  const intentRow=document.querySelector('.intent-row');
  const{intent,conf,sub,ambig}=r;

  // ── New intent types ────────────────────────────────────────
  if(intent==='EXACT_SKU'){
    ibadge.className='badge product'; ibadge.textContent=`Item Found · ${r.product?.sku||''}`;
    cfill.style.width='100%'; cfill.style.background='#00875a'; cpct.textContent='100%';
    if(intentRow) intentRow.classList.add('has-intent');
    if(r.product) showExactSkuDisambig(r.product);
    return;
  }
  if(intent==='SKU_COMPARE'){
    ibadge.className='badge product'; ibadge.textContent=`Comparing: ${(r.skus||[]).join(' vs ')}`;
    cfill.style.width='100%'; cfill.style.background='#0052cc'; cpct.textContent='100%';
    if(intentRow) intentRow.classList.add('has-intent');
    disambigEl.classList.remove('open'); return;
  }
  if(intent==='FEATURE_NAV'){
    ibadge.className='badge document'; ibadge.textContent=`Navigate to: ${r.feature?.label||''}`;
    cfill.style.width='100%'; cfill.style.background='#403294'; cpct.textContent='100%';
    if(intentRow) intentRow.classList.add('has-intent');
    disambigEl.classList.remove('open'); return;
  }
  if(intent==='ORDER_LOOKUP'){
    ibadge.className='badge document'; ibadge.textContent=`Order: ${r.orderNum||''}`;
    cfill.style.width='100%'; cfill.style.background='#7a4100'; cpct.textContent='100%';
    if(intentRow) intentRow.classList.add('has-intent');
    disambigEl.classList.remove('open'); return;
  }
  // ── Standard intents ────────────────────────────────────────
  if(!intent||conf<0.18){
    ibadge.className='badge'; ibadge.textContent='';
    cfill.style.width='0%'; cpct.textContent='';
    if(intentRow) intentRow.classList.remove('has-intent');
    return;
  }
  const s=INTENT_STYLE[intent]||{};
  const slbl=sub?` → ${sub}`:'';
  ibadge.className=`badge ${ambig?'ambiguous':s.cls}`;
  ibadge.textContent=`${s.lbl}${slbl}`;
  ibadge.setAttribute('aria-label',`Detected: ${s.lbl}${slbl}, ${Math.round(conf*100)}% confidence`);
  cfill.style.width=Math.round(conf*100)+'%';
  cfill.style.background=ambig?'#ff8b00':'#0052cc';
  cpct.textContent=Math.round(conf*100)+'%';
  if(intentRow) intentRow.classList.add('has-intent');
}

function hideIntent(){
  const intentRow=document.querySelector('.intent-row');
  ibadge.className='badge'; ibadge.textContent='';
  cfill.style.width='0%'; cpct.textContent='';
  if(intentRow) intentRow.classList.remove('has-intent');
}

function showDisambig(r){
  const opts=[];
  if(r.all.PRODUCT>0.25) opts.push({lbl:'Product Search',intent:'PRODUCT',sub:'',score:r.all.PRODUCT});
  if(r.all.DOCUMENT>0.25){
    const tops=Object.entries(r.dSubs).filter(([,v])=>v>0.25).sort((a,b)=>b[1]-a[1]).slice(0,3);
    tops.forEach(([n,v])=>opts.push({lbl:`Document: ${n}`,intent:'DOCUMENT',sub:n,score:v}));
  }
  if(r.all.QA>0.25) opts.push({lbl:'Q&A / General',intent:'QA',sub:'',score:r.all.QA});
  if(opts.length<2){disambigEl.classList.remove('open');return;}
  disambigEl.classList.add('open');
  disambigOpts.innerHTML=opts.map(o=>`<button class="disambig-btn" onclick="runSearch('${ea(qi.value)}','${o.intent}','${ea(o.sub)}')">${o.lbl} <span style="font-family:var(--mono);font-size:10px;color:var(--text-muted)">${Math.round(o.score*100)}%</span></button>`).join('');
}

function updateAC(q){
  const n=q.toLowerCase();
  // Build "Looking For" suggestions from SUGGEST + PRODUCTS catalog
  const fromSuggest=SUGGEST.filter(s=>s.t.toLowerCase().includes(n)||s.h.toLowerCase().includes(n)).slice(0,5);
  const fromCatalog=PRODUCTS.filter(p=>p.name.toLowerCase().includes(n)||p.sku.toLowerCase().includes(n))
    .slice(0,4).map(p=>({t:p.name,h:`Item # ${p.sku}`,i:'📦'}));
  // Deduplicate
  const seen=new Set(fromSuggest.map(s=>s.t.toLowerCase()));
  const combined=[...fromSuggest,...fromCatalog.filter(c=>!seen.has(c.t.toLowerCase()))].slice(0,8);
  if(!combined.length){acdrop.classList.remove('open');qi.setAttribute('aria-expanded','false');return;}
  const listHTML=combined.map(s=>`
    <div class="sd-look-item" role="option" tabindex="0"
      onclick="pickAC('${ea(s.t)}')"
      onkeydown="if(event.key==='Enter')pickAC('${ea(s.t)}')"
      aria-label="${s.t} — ${s.h}">
      <span class="sd-look-ico" aria-hidden="true">${s.i}</span>
      <span>
        <span>${hl(s.t,q)}</span>
        <br><span style="font-size:11px;color:var(--text-muted)">${s.h}</span>
      </span>
    </div>`).join('');
  acdrop.innerHTML=`
    <div class="sd-looking-hdr">Looking for <strong>${q}</strong></div>
    <div class="sd-look-list" role="listbox">${listHTML}</div>`;
  acdrop.classList.add('open');
  qi.setAttribute('aria-expanded','true');
}

function pickAC(t){
  qi.value=t; acdrop.classList.remove('open'); qi.setAttribute('aria-expanded','false');
  qi.dispatchEvent(new Event('input')); runSearch(t);
}

qi.addEventListener('focus',function(){
  if(!this.value.trim()) showFocusDropdown();
});

qi.addEventListener('input',function(){
  const q=this.value;
  if(!q.trim()){
    hideIntent();
    showFocusDropdown();
    disambigEl.classList.remove('open'); return;
  }
  const r=detectIntent(q);
  updateBadge(r); updateAC(q);
  if(r.ambig&&r.conf>0.28) showDisambig(r);
  else disambigEl.classList.remove('open');
});

qi.addEventListener('keydown',function(e){
  if(e.key==='Enter'){runSearch(this.value);}
  if(e.key==='Escape'){acdrop.classList.remove('open');this.setAttribute('aria-expanded','false');}
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.s-wrap')){ acdrop.classList.remove('open');qi.setAttribute('aria-expanded','false'); }
});

sbtn.addEventListener('click',()=>runSearch(qi.value));

function setQ(q){ qi.value=q; qi.dispatchEvent(new Event('input')); runSearch(q); }

async function runSearch(raw,forceIntent=null,forceSub=null){
  const q=raw.trim(); if(!q)return;
  acdrop.classList.remove('open'); qi.setAttribute('aria-expanded','false');
  const r=detectIntent(q);
  const intent=forceIntent||r.intent;
  const sub=forceSub!==null?forceSub:r.sub;
  disambigEl.classList.remove('open');
  // ── New intent routes ──────────────────────────────────────
  if(intent==='EXACT_SKU')       renderItemPage(r.product?.sku||q);
  else if(intent==='SKU_COMPARE')     renderSkuCompare(r,q);
  else if(intent==='FEATURE_NAV')     renderFeatureRedirect(r.feature,q);
  else if(intent==='ORDER_LOOKUP')    renderOrderDetails(r.orderNum,q);
  // ── Original routes ────────────────────────────────────────
  else if(intent==='PRODUCT') renderProducts(q,r);
  else if(intent==='DOCUMENT') renderDocs(q,r,sub);
  else await renderQA(q,r);
  resultsEl.scrollIntoView({behavior:'smooth',block:'start'});
}

function productCatalogScore(q){
  const raw=q.trim();
  if(!raw||typeof PRODUCTS==='undefined') return 0;
  const n=raw.toLowerCase();
  if(PRODUCTS.some(p=>p.sku.toLowerCase()===n||String(p.cmir||'').toLowerCase()===n)) return 1;
  if(PRODUCTS.some(p=>p.sku.toLowerCase().includes(n)||String(p.cmir||'').toLowerCase().includes(n))) return 0.94;

  const words=norm(raw).split(/\s+/).filter(w=>w.length>1);
  if(!words.length) return 0;
  let best=0;
  PRODUCTS.forEach(p=>{
    const hay=(p.name+' '+p.brand+' '+p.sku+' '+(p.cmir||'')).toLowerCase();
    const hits=words.reduce((acc,w)=>acc+(hay.includes(w)?1:0),0);
    if(hits) best=Math.max(best,Math.min(0.95,0.46+(hits/words.length)*0.44+(hits>1?0.08:0)));
  });
  return best;
}

function filterProducts(q){
  const raw=q.trim();
  // Numeric-only → SKU lookup
  if(/^\d+$/.test(raw)){
    const found=PRODUCTS.filter(p=>p.sku.includes(raw));
    return found.length?found:PRODUCTS;
  }
  // Alphanumeric SKU pattern
  if(/^[A-Z]{2,5}\d/i.test(raw)){
    const found=PRODUCTS.filter(p=>p.sku.toLowerCase().includes(raw.toLowerCase()));
    return found.length?found:PRODUCTS;
  }
  // Word-level scoring — split query and score each product
  const words=norm(raw).split(/\s+/).filter(w=>w.length>1);
  if(!words.length) return PRODUCTS;
  const scored=PRODUCTS.map(p=>{
    const hay=(p.name+' '+p.brand+' '+p.sku+' '+(p.cmir||'')).toLowerCase();
    const score=words.reduce((acc,w)=>acc+(hay.includes(w)?1:0),0);
    return{p,score};
  });
  const matched=scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p);
  return matched.length?matched:PRODUCTS;
}

function scoreItems(q, items, kwField){
  const words=norm(q).split(/\s+/).filter(w=>w.length>2);
  if(!words.length) return items;
  const scored=items.map(item=>{
    const keys=item[kwField]||[];
    const score=words.reduce((a,w)=>a+(keys.some(k=>k.includes(w)||w.includes(k))?1:0),0);
    return{item,score};
  });
  const matched=scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.item);
  return matched.length?matched:items;
}

function switchTab(tab){
  document.querySelectorAll('.rtab').forEach(t=>{
    t.classList.remove('active'); t.setAttribute('aria-selected','false');
  });
  const active=document.getElementById('tab-'+tab);
  if(active){ active.classList.add('active'); active.setAttribute('aria-selected','true'); }
  const prodContent=document.getElementById('product-tab-content');
  const other=document.getElementById('other-tab-content');
  const q=window._currentQ||'';
  if(tab==='products'){
    if(prodContent) prodContent.classList.remove('hidden');
    if(other) other.classList.add('hidden');
  } else {
    if(prodContent) prodContent.classList.add('hidden');
    if(other){
      other.classList.remove('hidden');
      if(tab==='documents') other.innerHTML=renderTabDocs(q);
      else if(tab==='videos') other.innerHTML=renderTabVideos(q);
      else if(tab==='guides') other.innerHTML=renderTabGuides(q);
    }
  }
}

function matchByKW(q, kwMap){
  const words=norm(q).split(/\s+/).filter(w=>w.length>2);
  return PRODUCTS.map(p=>{
    const keys=kwMap[p.sku]||[];
    const score=words.reduce((a,w)=>a+(keys.some(k=>k.includes(w)||w.includes(k))||p.name.toLowerCase().includes(w)?1:0),0);
    return{p,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p);
}

function matchDocs(q){
  const words=norm(q).split(/\s+/).filter(w=>w.length>2);
  return QA_RELATED_DOCS.map(d=>{
    const score=words.reduce((a,w)=>a+(d.kw.some(k=>k.includes(w)||w.includes(k))?1:0),0);
    return{d,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.d);
}

// ── MARKDOWN-LITE FORMATTER ───────────────────────────────────

function fmtAnswer(text){
  if(!text) return '<p>No answer available.</p>';
  const lines=text.split('\n');
  let html='',inUl=false,inOl=false;
  for(const raw of lines){
    const line=raw.trim();
    if(!line){
      if(inUl){html+='</ul>';inUl=false;}
      if(inOl){html+='</ol>';inOl=false;}
      continue;
    }
    const fmt=l=>l
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/`(.+?)`/g,'<code style="font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px">$1</code>');
    if(/^[-•]\s/.test(line)){
      if(!inUl){if(inOl){html+='</ol>';inOl=false;} html+='<ul>';inUl=true;}
      html+=`<li>${fmt(line.replace(/^[-•]\s/,''))}</li>`;
    } else if(/^\d+\.\s/.test(line)){
      if(!inOl){if(inUl){html+='</ul>';inUl=false;} html+='<ol>';inOl=true;}
      html+=`<li>${fmt(line.replace(/^\d+\.\s/,''))}</li>`;
    } else {
      if(inUl){html+='</ul>';inUl=false;}
      if(inOl){html+='</ol>';inOl=false;}
      html+=`<p>${fmt(line)}</p>`;
    }
  }
  if(inUl) html+='</ul>';
  if(inOl) html+='</ol>';
  return html;
}

function localAIAnswer(q, docs, products){
  const n=norm(q);
  if(n.includes('shelf life')||n.includes('expiration')||n.includes('expiry')) return QA_KB.shelf_life;
  if(n.includes('compare')||n.includes('difference between')||n.includes('nitrile vs')||n.includes('latex')) return QA_KB.compare;

  const productNames=products.slice(0,3).map(p=>p.name).join(', ');
  const docNames=docs.slice(0,2).map(d=>d.title).join('; ');

  if(n.includes('recall')) return `For recall questions, first match the recall ID, affected item, and lot number against the active recall notice. Then quarantine affected stock, stop reordering the impacted lot, and document replacement or return steps.\n\nRelated references found: ${docNames || 'recall notices and safety alerts'}.`;
  if(n.includes('sds')||n.includes('msds')||n.includes('safety data')) return `For SDS or MSDS questions, use the latest safety data sheet as the source of truth. Check hazard classification, PPE requirements, storage conditions, spill response, and disposal instructions before handling the item.\n\nRelated references found: ${docNames || 'safety data sheets and compliance documents'}.`;
  if(n.includes('ifu')||n.includes('instructions for use')) return `For IFU questions, follow the product-specific instructions for setup, use, cleaning, storage, and disposal. If clinical use is involved, verify the item, size, sterility, and expiration before use.\n\nRelated references found: ${docNames || 'instructions for use and product guides'}.`;
  if(n.includes('stock')||n.includes('available')||n.includes('availability')) return `For availability questions, check the product card status first, then confirm substitute options if the item is low or out of stock. Prioritize equivalent size, material, and clinical category before changing products.\n\nMatching products found: ${productNames || 'related catalog items'}.`;
  if(n.includes('price')||n.includes('cost')) return `For price questions, compare the displayed unit price with the selected packaging unit. Case pricing and each-unit pricing can differ, so confirm the unit selector before ordering.\n\nMatching products found: ${productNames || 'related catalog items'}.`;

  return `Here is the best answer from the available catalog and document context:\n\n- Start with the most relevant product or document match for the question.\n- Verify SKU, item description, size, and status before making a purchasing or clinical decision.\n- For compliance, safety, or use instructions, rely on the matching SDS, IFU, guide, or recall document.\n\nRelated products: ${productNames || 'no exact product match found'}.\nRelated documents: ${docNames || 'no exact document match found'}.`;
}

function parseOrderNum(q) {
  const patterns = [
    /\b(ORD-\d{4}-\d{4,})\b/i,
    /\border[#\s]+(\d{4,})/i,
    /\b#(\d{5,})\b/,
  ];
  for (const re of patterns) {
    const m = q.match(re);
    if (m) return (m[1]||m[0]).toUpperCase();
  }
  return null;
}

function detectSpecialIntent(raw) {
  const q = raw.trim();
  const n = q.toLowerCase();

  // ── Feature navigation ──────────────────────────────────────
  for (const [kw, feat] of Object.entries(FEATURE_MAP)) {
    if (n === kw || n.startsWith(kw) || n.endsWith(kw)) {
      return { intent:'FEATURE_NAV', conf:1.0, sub:null, ambig:false, all:{}, feature:feat };
    }
  }

  // ── SKU vs SKU ──────────────────────────────────────────────
  const vsMatch = q.match(/^([A-Z0-9]{3,})\s+vs\s+([A-Z0-9]{3,})$/i);
  if (vsMatch) {
    const s1 = vsMatch[1], s2 = vsMatch[2];
    const p1 = PRODUCTS.find(p => p.sku.toLowerCase() === s1.toLowerCase());
    const p2 = PRODUCTS.find(p => p.sku.toLowerCase() === s2.toLowerCase());
    return { intent:'SKU_COMPARE', conf:1.0, sub:null, ambig:false, all:{}, skus:[s1,s2], products:[p1,p2] };
  }

  // ── Order lookup ────────────────────────────────────────────
  const orderNum = parseOrderNum(q);
  if (orderNum) {
    return { intent:'ORDER_LOOKUP', conf:1.0, sub:null, ambig:false, all:{}, orderNum };
  }

  // ── Exact SKU / CMIR match ──────────────────────────────────
  const exactProd = PRODUCTS.find(p =>
    p.sku.toLowerCase() === n || (p.cmir && p.cmir.toLowerCase() === n)
  );
  if (exactProd) {
    return { intent:'EXACT_SKU', conf:1.0, sub:null, ambig:false, all:{}, product:exactProd };
  }

  return null;
}

function renderComparables(sku) {
  const base = PRODUCTS.find(p => p.sku.toLowerCase() === (sku||'').toLowerCase()) || PRODUCTS[0];
  // Find similar products (same category heuristic)
  const category = base.name.toLowerCase().includes('glove') ? 'glove'
    : base.name.toLowerCase().includes('brief') ? 'brief'
    : base.name.toLowerCase().includes('catheter') || base.name.toLowerCase().includes('foley') ? 'catheter'
    : base.name.toLowerCase().includes('mask') || base.name.toLowerCase().includes('n95') ? 'mask'
    : null;
  let comparables = category
    ? PRODUCTS.filter(p => p.sku !== base.sku && p.name.toLowerCase().includes(category)).slice(0,3)
    : PRODUCTS.filter(p => p.sku !== base.sku).slice(0,3);
  if (!comparables.length) comparables = PRODUCTS.filter(p => p.sku !== base.sku).slice(0,3);

    <div class="order-page-hdr">
      <div>
        <div class="order-num">${order.num}</div>
        <div class="order-meta">
          <div class="order-meta-item">Date <span>${order.date}</span></div>
          <div class="order-meta-item">Items <span>${order.lines.length}</span></div>
          <div class="order-meta-item">Shipped to <span>${order.ship.to.split('—')[0].trim()}</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
        <div class="order-status-badge" style="background:${statusBgs[order.status]};color:${statusColors[order.status]};">
          ● ${order.status}
        </div>
        <div style="font-size:18px;font-weight:700;color:var(--t1);">${order.total}</div>
      </div>
    </div>

    <div class="order-body">
      <div class="order-section-hdr">
        <span>Line Items (${order.lines.length})</span>
        <span style="font-family:var(--mono);font-size:10px;">QTY · UNIT PRICE · TOTAL</span>
      </div>
      ${order.lines.map(l=>{
        const prod = PRODUCTS.find(p=>p.sku===l.sku)||null;
        return `<div class="order-line-grid">
          <div class="order-line-img">${prod?prodImg(prod.name):PROD_IMG.default}</div>
          <div>
            <div class="order-line-name">${l.name}</div>
            <div class="order-line-sku">${l.sku}</div>
          </div>
          <div class="order-line-val">${l.qty} ${l.unit}</div>
          <div class="order-line-val">${l.price}</div>
          <div class="order-line-total">${l.total}</div>
        </div>`;}).join('')}

      <div class="order-shipping">
        <div class="order-ship-block">
          <div class="order-ship-label">Deliver To</div>
          <div class="order-ship-val">${order.ship.to.replace('—','<br>')}</div>
        </div>
        <div class="order-ship-block">
          <div class="order-ship-label">Estimated Delivery</div>
          <div class="order-ship-val">${order.ship.est}</div>
        </div>
        <div class="order-ship-block">
          <div class="order-ship-label">Tracking Number</div>
          <div class="order-ship-val" style="font-family:var(--mono);font-size:11px;">${order.ship.track}</div>
        </div>
      </div>
    </div>

    <div class="order-footer">
      <div class="order-footer-total">Order Total: ${order.total}</div>
      <div class="order-footer-actions">
        <button class="order-action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Invoice
        </button>
        <button class="order-action-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Packing Slip
        </button>
        <button class="order-action-btn primary" onclick="this.textContent='✓ Added to Cart';this.style.background='#006644'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Reorder All
        </button>
      </div>
    </div>
  </div>`;
  disambigEl.classList.remove('open');
}

function toggleTests(){
  const g=document.getElementById('tgrid');
  const c=document.getElementById('tchev');
  const h=document.querySelector('.tpanel-hdr');
  const isHidden=g.classList.contains('hidden');
  if(isHidden){
    g.classList.remove('hidden');
    c.style.transform='rotate(180deg)';
    h.setAttribute('aria-expanded','true');
    g.innerHTML=TESTS.map((t,i)=>`
      <div class="tq" onclick="setQ('${ea(t.q)}')" tabindex="0" role="listitem"
           onkeydown="if(event.key==='Enter')setQ('${ea(t.q)}')"
           aria-label="Test query: ${t.q}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="tq-num">#${String(i+1).padStart(2,'0')}</span>
          <span class="tq-exp">${t.ex}</span>
        </div>
        <div class="tq-text">${t.q}</div>
        <div class="tq-exp">${t.n}</div>
      </div>`).join('');
  } else {
    g.classList.add('hidden');
    c.style.transform='rotate(0deg)';
    h.setAttribute('aria-expanded','false');
  }
}
</script>
</body>
</html>
